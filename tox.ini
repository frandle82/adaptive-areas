[tox]
envlist = lint, ha-stable, ha-beta

[testenv]
description = Run pytest
basepython = python3.14
skip_install = true
passenv = HA_VERSION
# The test plugin pins exactly one Home Assistant release (and pytest 9.0.3). Both values are
# explicit so the resolver never falls back to an older plugin (0.2.1 pins pytest 6.2.2, which
# fails at pytest start-up on Python 3.14). Checked against PyPI metadata on 2026-11-24:
# 0.13.375 pins homeassistant 2026.10.4. No plugin release supports 2026.11.0b6 yet, so the
# beta environment fails early with ResolutionImpossible until a compatible plugin exists.
deps =
    homeassistant=={env:HA_VERSION}
    pytest-homeassistant-custom-component=={env:HA_PLUGIN_VERSION:0.13.375}
commands =
    coverage run -m pytest {posargs}
    coverage report

# Supported stable target. Keep in sync with HA_STABLE_VERSION in .github/workflows/pytest.yml.
# Move it only when pytest-homeassistant-custom-component supports the next release.
[testenv:ha-stable]
description = Test with the supported stable HA release
setenv =
    HA_VERSION = {env:HA_STABLE_VERSION:2026.10.4}

[testenv:ha-beta]
description = Test with latest HA beta
setenv =
    HA_VERSION = {env:HA_BETA_VERSION}

[testenv:lint]
description = Run linters with pre-commit
deps =
    pre-commit
commands = pre-commit run --all-files
