<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Areas brand icon</title>
  <desc id="desc">Four connected room tiles with one active presence-aware area and a subtle sparkle.</desc>

  <!-- Four rooms: the asymmetric inner corners suggest a compact floor plan. -->
  <path d="M48 30h168c18 0 32 14 32 32v154c0 18-14 32-32 32H48c-18 0-32-14-32-32V62c0-18 14-32 32-32Z"
        fill="#20C6D7" stroke="#132B5E" stroke-width="16"/>
  <path d="M296 30h168c18 0 32 14 32 32v154c0 18-14 32-32 32H296c-18 0-32-14-32-32V62c0-18 14-32 32-32Z"
        fill="#6957E8" stroke="#132B5E" stroke-width="16"/>
  <path d="M48 264h168c18 0 32 14 32 32v154c0 18-14 32-32 32H48c-18 0-32-14-32-32V296c0-18 14-32 32-32Z"
        fill="#2589E8" stroke="#132B5E" stroke-width="16"/>
  <path d="M296 264h168c18 0 32 14 32 32v154c0 18-14 32-32 32H296c-18 0-32-14-32-32V296c0-18 14-32 32-32Z"
        fill="#FFB547" stroke="#132B5E" stroke-width="16"/>

  <!-- Presence signal inside the active room. -->
  <path d="M326 372c29-29 77-29 106 0"
        fill="none" stroke="#132B5E" stroke-width="18" stroke-linecap="round"/>
  <path d="M346 394c18-18 47-18 65 0"
        fill="none" stroke="#132B5E" stroke-width="16" stroke-linecap="round"/>
  <circle cx="378.5" cy="425" r="20" fill="#132B5E"/>

  <!-- A restrained four-point magic spark, integrated into the active tile. -->
  <path d="M431 298c3 15 11 23 26 26-15 3-23 11-26 26-3-15-11-23-26-26 15-3 23-11 26-26Z"
        fill="#FFFFFF"/>
  <circle cx="462" cy="354" r="7" fill="#FFFFFF"/>
</svg>
