name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ruff:
    name: "Lint"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Set up Python"
          uses: actions/setup-python@v7
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install tox and pre-commit"
          run: python3 -m pip install tox "pre-commit~=4.6"

        - name: "Run"
          run: tox -e lint
