name: Run tests with pinned stable Home Assistant

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test-stable:
    name: "Test against stable release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tox and jq
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          sudo apt-get update && sudo apt-get install -y jq

      # Pinned to the newest Home Assistant release that pytest-homeassistant-custom-component
      # 0.13.375 supports. The harness pins HA exactly, so it resolves to 0.13.375 here.
      # Move this pin forward only when a harness release supports the next HA version.
      - name: Use pinned Home Assistant stable version
        run: echo "HA_STABLE_VERSION=2026.10.4" >> $GITHUB_ENV

      - name: Run tox for stable
        run: tox -e ha-stable
        env:
          HA_STABLE_VERSION: ${{ env.HA_STABLE_VERSION }}

  test-beta:
    name: "Test against beta release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tox and jq
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          sudo apt-get update && sudo apt-get install -y jq

      - name: Get latest HA beta version from PyPI
        run: |
          VERSIONS=$(curl -s https://pypi.org/pypi/homeassistant/json | jq -r '.releases | keys | .[]')
          BETA=$(echo "$VERSIONS" | grep 'b' | sort -Vr | head -n1)
          echo "HA_BETA_VERSION=$BETA" >> $GITHUB_ENV

      - name: Run tox for beta
        run: tox -e ha-beta
        env:
          HA_BETA_VERSION: ${{ env.HA_BETA_VERSION }}
