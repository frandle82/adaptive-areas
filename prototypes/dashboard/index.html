<!doctype html>
<html lang="de">
<head>

<title>Adaptive Areas – Prototyp (Mock-Daten)</title>
<style>
/* Designreferenz. Keine externen Ressourcen. Farben nur über Variablen (HA-Theme-Namen). */
:root {
  --primary-color: #039BC3;
  --primary-strong: #02708A;
  --primary-text: #02708A;
  --success-color: #16A085;
  --success-text: #0F7A64;
  --neutral-color: #9CA3AF;
  --warning-color: #D97706;
  --warning-text: #92400E;
  --error-color: #DC2626;
  --error-text: #B91C1C;
  --sleep-color: #8B5CF6;
  --primary-text-color: #1F2937;
  --secondary-text-color: #5B6472;
  --card-background-color: #FFFFFF;
  --page-background-color: #F3F5F7;
  --divider-color: #D8DDE3;
  --focus-color: #039BC3;
  --radius: 12px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
}
:root[data-theme="dark"] {
  --primary-color: #39B6D9;
  --primary-strong: #0E7C98;
  --primary-text: #7DD3EA;
  --success-color: #34C3A6;
  --success-text: #34C3A6;
  --neutral-color: #9CA3AF;
  --warning-color: #F5A524;
  --warning-text: #F5C26B;
  --error-color: #F87171;
  --error-text: #FCA5A5;
  --sleep-color: #A78BFA;
  --primary-text-color: #E5E7EB;
  --secondary-text-color: #9CA3AF;
  --card-background-color: #1F2933;
  --page-background-color: #111820;
  --divider-color: #334155;
  --focus-color: #39B6D9;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page-background-color); color: var(--primary-text-color); font-size: 15px; line-height: 1.45; }
button, select, input { font: inherit; color: inherit; }
button { min-height: 44px; min-width: 44px; padding: 0 var(--space-3); border: 1px solid var(--divider-color); border-radius: 10px; background: var(--card-background-color); cursor: pointer; }
button[aria-pressed="true"], button[aria-current="true"], button.primary { border-color: var(--primary-color); color: var(--primary-text); font-weight: 600; }
button.primary { background: var(--primary-strong); border-color: var(--primary-strong); color: #fff; }
button.danger { border-color: var(--error-color); color: var(--error-text); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--focus-color); outline-offset: 2px; }
input, select { min-height: 44px; padding: 0 var(--space-3); width: 100%; border: 1px solid var(--divider-color); border-radius: 10px; background: var(--card-background-color); }
label { display: block; font-size: 13px; color: var(--secondary-text-color); margin-bottom: var(--space-1); }
label.check { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; font-size: 15px; color: var(--primary-text-color); margin: 0; }
label.check input { width: 24px; height: 24px; min-height: 24px; padding: 0; flex: 0 0 auto; accent-color: var(--primary-strong); }
.kpi.active { border-color: var(--primary-color); box-shadow: inset 0 0 0 1px var(--primary-color); }
.kpi-static { cursor: default; }
.res svg.i { width: 14px; height: 14px; vertical-align: -2px; }
svg.i { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ok { color: var(--success-text); } .warn { color: var(--warning-text); } .err { color: var(--error-text); } .muted { color: var(--secondary-text-color); }
.stale { font-style: italic; font-weight: 400; }

.mock-banner { background: var(--warning-color); color: #111; font-weight: 600; padding: var(--space-2) var(--space-4); text-align: center; font-size: 13px; }
#app { max-width: var(--frame, 1280px); margin: 0 auto; padding: var(--space-4); container-type: inline-size; background: var(--page-background-color); min-height: 100vh; }

/* Kopfzeile */
.top { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }
.brand { display: flex; gap: var(--space-3); align-items: center; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary-strong); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.brand h1 { font-size: 20px; margin: 0; font-weight: 600; }
.brand p { margin: 0; color: var(--secondary-text-color); font-size: 13px; }
.conn { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font-size: 13px; color: var(--secondary-text-color); }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--divider-color); color: var(--secondary-text-color); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }

details.controls { margin: var(--space-3) 0; }
details.controls summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--secondary-text-color); font-size: 13px; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-2) 0; }
.toolbar .group { display: flex; gap: var(--space-1); flex-wrap: wrap; }

/* Navigation: drei Gruppen, Unteransichten darunter; umbrechend, ohne horizontales Scrollen */
.groups { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-3) 0 var(--space-2); }
.groups button { border: none; background: transparent; padding: 0 var(--space-2); font-weight: 600; }
.groups button[aria-current="true"] { color: var(--primary-text); border-bottom: 3px solid var(--primary-color); border-radius: 0; }
.subnav { display: flex; flex-wrap: wrap; gap: var(--space-1); padding-bottom: var(--space-3); border-bottom: 1px solid var(--divider-color); margin-bottom: var(--space-4); }
.subnav button { min-height: 44px; border-radius: 999px; font-size: 14px; padding: 0 var(--space-3); }
.subnav button[aria-current="true"] { background: var(--primary-strong); border-color: var(--primary-strong); color: #fff; }
.grp-label { font-weight: 600; padding: 8px 0; }

.notice { border: 1px solid var(--divider-color); border-left: 4px solid var(--primary-color); border-radius: var(--radius); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); background: var(--card-background-color); font-size: 14px; }
.banner { border: 1px solid var(--warning-color); border-left: 4px solid var(--warning-color); border-radius: var(--radius); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); background: var(--card-background-color); }
.banner.error { border-color: var(--error-color); border-left-color: var(--error-color); }
.sim { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px dashed var(--warning-text); color: var(--warning-text); margin-bottom: var(--space-3); }
.lead { color: var(--secondary-text-color); font-size: 14px; margin: 0 0 var(--space-4); }
.h1 { font-size: 18px; font-weight: 600; margin: 0 0 var(--space-1); }

/* Kennzahlen */
.kpis { display: grid; gap: var(--space-3); grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: var(--space-4); }
@container (min-width: 900px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { text-align: left; background: var(--card-background-color); border: 1px solid var(--divider-color); border-radius: var(--radius); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 4px; min-height: 44px; min-width: 0; font-weight: 400; }
.kpi .top2 { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); color: var(--secondary-text-color); font-size: 13px; }
.kpi .v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 14px; font-weight: 400; color: var(--secondary-text-color); }
.kpi .s { font-size: 13px; color: var(--secondary-text-color); }
.kpi-row { display: grid; gap: var(--space-2); grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: var(--space-4); }
@container (min-width: 900px) { .kpi-row { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.kpi-row .kpi { min-height: 0; }

/* Filter */
.filters { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: end; margin-bottom: var(--space-4); }
.filters .search { flex: 1 1 220px; min-width: 0; }
.chips { display: flex; gap: var(--space-1); flex-wrap: wrap; }
.chips button { min-height: 44px; border-radius: 999px; font-size: 14px; }

/* Bereichskarten */
.floor { margin: var(--space-6) 0 var(--space-3); font-size: 13px; color: var(--secondary-text-color); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.grid { display: grid; gap: var(--space-3); grid-template-columns: 1fr; align-items: stretch; }
@container (min-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (min-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container (min-width: 1200px) { .grid.wide { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card-link { text-align: left; width: 100%; min-height: 44px; border: 1px solid var(--divider-color); background: var(--card-background-color); border-radius: var(--radius); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; font-weight: 400; }
.card-link:hover { border-color: var(--primary-color); }
.card-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 20px; gap: var(--space-2); align-items: center; }
.tile { width: 40px; height: 40px; border-radius: 12px; background: var(--page-background-color); border: 1px solid var(--divider-color); display: inline-flex; align-items: center; justify-content: center; color: var(--primary-text); }
.name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; min-width: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chev { color: var(--secondary-text-color); display: inline-flex; }
/* Schmale Karten: Status unter dem Namen statt Überlagerung; kein Schrumpfen der Icons */
.tile, .chev { flex: 0 0 auto; }
@container (max-width: 520px) { .card-head { grid-template-columns: 40px minmax(0, 1fr) 20px; } .card-head .status { grid-column: 2; } }
.name { hyphens: auto; }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.metric { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metric .lbl { font-size: 12px; color: var(--secondary-text-color); display: flex; gap: 4px; align-items: center; }
.metric .val { font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 600; overflow-wrap: anywhere; }
.metric .val.none { font-weight: 400; color: var(--secondary-text-color); font-size: 13px; }
.chips-line { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--divider-color); color: var(--secondary-text-color); }
.ctx { display: flex; flex-direction: column; gap: 4px; border-top: 1px dashed var(--divider-color); padding-top: var(--space-2); font-size: 13px; }
.ctx div { display: flex; gap: 6px; align-items: flex-start; }
.ctx .warnline { font-weight: 600; color: var(--warning-text); }
.ctx .techline { font-weight: 600; color: var(--error-text); }

/* Meta-Areas */
.meta-row { display: grid; gap: var(--space-2); grid-template-columns: 1fr; margin-bottom: var(--space-4); }
@container (min-width: 600px) { .meta-row { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.meta-card { border: 1px dashed var(--divider-color); border-radius: var(--radius); padding: var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* Abschnitte */
.section { background: var(--card-background-color); border: 1px solid var(--divider-color); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-4); min-width: 0; }
.section h2 { font-size: 15px; margin: 0 0 var(--space-3); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.kv { display: grid; grid-template-columns: minmax(110px, 40%) minmax(0, 1fr); gap: var(--space-2) var(--space-3); font-size: 14px; margin: 0; }
.kv dt { color: var(--secondary-text-color); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.two { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@container (min-width: 900px) { .two { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); } }
.placeholder { border: 1px dashed var(--divider-color); border-radius: var(--radius); padding: var(--space-4); color: var(--secondary-text-color); margin-bottom: var(--space-4); }

/* Balken mit Skala */
.bars { display: flex; flex-direction: column; gap: var(--space-3); }
.bar-row .row { display: flex; justify-content: space-between; gap: var(--space-2); font-size: 14px; }
.bar { height: 10px; background: var(--divider-color); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.bar > span { display: block; height: 100%; background: var(--primary-color); border-radius: 999px; }
.skeleton { height: 10px; border-radius: 999px; margin-top: 4px; border: 1px dashed var(--divider-color); }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--secondary-text-color); margin-top: 6px; font-variant-numeric: tabular-nums; }
.legend { font-size: 12px; color: var(--secondary-text-color); margin: var(--space-2) 0 0; }

/* Listen (Reinigung) */
.item { display: flex; justify-content: space-between; gap: var(--space-2); align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--divider-color); min-height: 44px; }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .m { font-size: 13px; color: var(--secondary-text-color); text-align: right; }

/* Decision Trace */
.timeline { list-style: none; margin: 0; padding: 0; }
.tl { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: var(--space-2); padding-bottom: var(--space-4); position: relative; }
.tl::before { content: ""; position: absolute; left: 12px; top: 26px; bottom: 0; width: 2px; background: var(--divider-color); }
.tl:last-child::before { display: none; }
.tl .fi { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--divider-color); background: var(--card-background-color); color: var(--primary-text); display: inline-flex; align-items: center; justify-content: center; }
.tl .ts { font-variant-numeric: tabular-nums; color: var(--secondary-text-color); font-size: 13px; }
.tl .dec { font-weight: 600; overflow-wrap: anywhere; }
.tl .meta { font-size: 13px; color: var(--secondary-text-color); }
.res { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--divider-color); margin-left: 6px; white-space: nowrap; font-weight: 400; }
.tl .why { font-size: 13px; margin-top: 4px; }
.tl .why.none { color: var(--secondary-text-color); font-style: italic; }

/* Tabellen (ergänzend) */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: var(--space-2); border-bottom: 1px solid var(--divider-color); vertical-align: top; }
th { color: var(--secondary-text-color); font-weight: 600; font-size: 13px; }
details.more { margin-top: var(--space-3); }
details.more summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--primary-text); font-weight: 600; }

/* Formulare */
.form-grid { display: grid; gap: var(--space-3); grid-template-columns: 1fr; }
@container (min-width: 700px) { .form-grid { grid-template-columns: 1fr 1fr; } }
.actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); justify-content: flex-end; }
.actions.start { justify-content: flex-start; }
.status-line { display: block; min-height: 24px; font-size: 14px; margin-top: var(--space-2); }

dialog { border: 1px solid var(--divider-color); border-radius: var(--radius); background: var(--card-background-color); color: var(--primary-text-color); padding: var(--space-6); max-width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.45); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

/* ================= Einstellungen und Bereichsbearbeitung (Formularmodell) ================= */
function statusText(key) {
  const f = key ? S.forms[key] : null;
  if (S.saving && S.savingKey === key) return "Wird gespeichert (simuliert) …";
  if (!f) return "";
  if (f.result) return f.result.text;
  if (isDirtyKey(key)) return S.conn === "lost" ? "Ungespeicherte Änderungen. Keine Verbindung: Speichern ist nicht möglich." : "Änderungen noch nicht gespeichert.";
  return "";
}
function statusNode(key) {
  const f = S.forms[key];
  const failed = !!(f && f.result && f.result.fail);
  return el("p", { role: "status", "aria-live": "polite", class: "status-line" + (failed ? " banner error" : "") }, statusText(key));
}
function discard() { discardKey(currentFormKey())(); }
function markDirty(e) {
  const key = currentFormKey();
  const f = formOf(key);
  if (e && e.target && e.target.id) f.draft[e.target.id] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (!S.saving) f.result = null;
  const st = document.querySelector('#view [role="status"]');
  if (st) { st.className = "status-line"; st.textContent = statusText(key); }
  updateSaveButtons(key);
}
function simulateSave() {
  const key = currentFormKey();

  const f = formOf(key);
  if (!isDirtyKey(key)) return;
  if (S.conn === "lost") { f.result = { text: "Keine Verbindung. Es wurde nichts gespeichert.", fail: true }; render(); return; }
  const snapshot = { ...f.draft };
  S.saving = true; S.savingKey = key; render();
  setTimeout(() => {
    S.saving = false; S.savingKey = null;
    const g = formOf(key);
    if (S.saveFail || S.conn === "lost") g.result = { text: "Speichern fehlgeschlagen. Ihre Eingaben bleiben erhalten.", fail: true };
    else { g.base = { ...snapshot }; g.result = { text: "Gespeichert (simuliert). Nur im Prototyp.", fail: false }; }
    render();
  }, 600);
}
function viewSettings() {
  const key = "settings"; const d = formOf(key).draft; const off = S.saving || null;
  return { node: el("div", null,
    el("h2", { class: "h1" }, "Globale Einstellungen"),
    el("p", { class: "lead" }, "Gilt für alle Bereiche. Gespeichert werden nur geänderte Felder."),

        el("option", { value: "", selected: d.wx === "" ? true : null }, "Keine"),
        el("option", { value: "w1", selected: d.wx === "w1" ? true : null }, "Wetter Zuhause"),
        el("option", { value: "w2", selected: d.wx === "w2" ? true : null }, "Wetterstation Garten (veraltet)"))),
      el("div", null, el("label", { for: "lx" }, "Helligkeitssensor"), el("select", { id: "lx", disabled: off, onchange: markDirty },
        el("option", { value: "", selected: d.lx === "" ? true : null }, "Keiner"),
        el("option", { value: "l1", selected: d.lx === "l1" ? true : null }, "Außenhelligkeit")))) ),
    el("p", { class: "muted", style: "font-size:13px" }, "Veraltete Einträge bleiben sichtbar und werden nicht still entfernt."),
    statusNode(key),
    el("div", { class: "actions" },
      el("button", { type: "button", disabled: off, onclick: discardKey(key) }, "Abbrechen"),
      el("button", { type: "button", class: "primary", "data-fk": "save", onclick: simulateSave }, S.saving ? "Speichern …" : "Speichern"))) };
}
function viewEditor() {
  const a = MOCK.areas.find(x => x.id === S.areaId) || MOCK.areas[0];
  const key = "editor:" + a.id;

  wrap.append(el("section", { class: "section" }, el("h2", null, "Allgemein"), el("div", { class: "form-grid" },
    el("div", null, el("label", { for: "en" }, "Name"), el("input", { id: "en", value: d.en, disabled: off, oninput: markDirty })),
    el("div", null, el("label", { for: "ef" }, "Etage"), el("select", { id: "ef", disabled: off, onchange: markDirty },
      ["Erdgeschoss", "Obergeschoss", "Außen"].map(v => el("option", { value: v, selected: d.ef === v ? true : null }, v)))))));
  wrap.append(el("section", { class: "section" }, el("h2", null, "Anwesenheit"), el("div", { class: "form-grid" },
    el("div", null, el("label", { for: "eto" }, "Ausschalten nach Abwesenheit (Sekunden)"), el("input", { id: "eto", type: "number", min: "0", value: d.eto, disabled: off, oninput: markDirty })))));
  wrap.append(el("section", { class: "section" }, el("h2", null, "Funktionen"),
    el("label", { class: "check" }, el("input", { id: "fx-light", type: "checkbox", checked: d["fx-light"] ? true : null, disabled: off, onchange: markDirty }), "Lichtautomatik"),
    el("label", { class: "check" }, el("input", { id: "fx-climate", type: "checkbox", checked: d["fx-climate"] ? true : null, disabled: off, onchange: markDirty }), "Klimaautomatik")));

    el("h2", { id: "confirm-title", style: "font-size:16px;margin:0 0 12px" }, "Bereich löschen?"),
    el("p", null, `„${a.name}“ wirklich löschen? Dies ist eine Simulation und wirkt nicht auf Home Assistant.`),
    el("div", { class: "actions" },
      el("button", { type: "button", onclick: () => { S.confirmDelete = false; S.restoreFocus = "btn-delete"; render(); } }, "Abbrechen"),
      el("button", { type: "button", class: "danger", onclick: () => { S.confirmDelete = false; S.restoreFocus = "btn-delete"; S.notice = "Löschen simuliert, keine Änderung."; render(); } }, "Endgültig löschen (simuliert)"))));
  return { node: wrap };

function viewLocked() {
  return { node: el("div", { class: "placeholder" }, el("strong", null, "Nur für Administratoren"), el("p", null, "Diese Ansicht ist Administratoren vorbehalten. Die Berechtigung wird serverseitig geprüft.")) };

function viewLoading() {

/* ================= Render ================= */
const VIEWS = { overview: viewOverview, areas: viewAreas, area: viewArea, environment: viewEnvironment, cleaning: viewCleaning, usage: viewUsage,
  lighting: viewLighting, climate: viewClimate, trace: viewTrace, diagnostics: viewDiagnostics, settings: viewSettings, editor: viewEditor, manage: viewManage };
function render() {
  const act = document.activeElement;
  const focusKey = act && (act.id || act.dataset.fk) || null;
  renderConn();
  renderNav();
  const notice = $("#notice");
  notice.replaceChildren();
  if (S.notice) notice.append(el("div", { class: "notice", role: "status" }, S.notice));
  const view = $("#view");
  let out;
  if (S.loading) out = viewLoading();
  else if (ADMIN_VIEWS.includes(S.view) && S.role !== "admin") out = viewLocked();
  else out = (VIEWS[S.view] || viewOverview)();
  view.replaceChildren(out.node);
  if (out.after) out.after();
  updateSaveButtons(currentFormKey());
  document.getElementById("leave-dialog")?.remove();
  if (S.confirmLeave) { const ld = leaveDialogNode(); document.body.append(ld); ld.showModal(); ld.querySelector("button").focus(); }
  const dlg = document.getElementById("confirm-dialog");
  if (dlg && !dlg.open) { dlg.addEventListener("close", () => { if (S.confirmDelete) { S.confirmDelete = false; S.restoreFocus = "btn-delete"; render(); } }); dlg.showModal(); dlg.querySelector("button").focus(); }
  const target = S.restoreFocus || focusKey;
  S.restoreFocus = null;
  if (target && !S.confirmLeave && !S.confirmDelete) {
    const n = document.getElementById(target) || document.querySelector('[data-fk="' + target + '"]');
    if (n && typeof n.focus === "function") n.focus({ preventScroll: true });
  }
  document.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === S.role)));
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === S.theme)));
  document.querySelectorAll("[data-width]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.width) === S.width)));
  $("#toggle-loss").setAttribute("aria-pressed", String(S.conn === "lost"));
  $("#toggle-unknown").setAttribute("aria-pressed", String(S.unknownMode));
  for (const k of Object.keys(S.off)) $("#toggle-feat-" + k).setAttribute("aria-pressed", String(S.off[k]));
  $("#toggle-savefail").setAttribute("aria-pressed", String(S.saveFail));
  $("#app").style.setProperty("--frame", S.width + "px");
}
/* ================= Steuerung (nur Prototyp) ================= */
document.querySelectorAll("[data-role]").forEach(b => b.addEventListener("click", () => {
  if (S.saving) { S.notice = "Speichern läuft. Der Rollenwechsel ist danach möglich."; render(); return; }
  if (anyDirty(null)) { S.pendingNav = { kind: "role", role: b.dataset.role }; S.confirmLeave = true; render(); return; }
  S.role = b.dataset.role; if (S.role !== "admin" && ADMIN_VIEWS.includes(S.view)) S.view = "overview"; render();
}));
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => { S.theme = b.dataset.themeBtn; document.documentElement.setAttribute("data-theme", S.theme); render(); }));
document.querySelectorAll("[data-width]").forEach(b => b.addEventListener("click", () => { S.width = Number(b.dataset.width); render(); }));
$("#toggle-loss").addEventListener("click", () => { S.conn = S.conn === "lost" ? "connected" : "lost"; render(); });

for (const k of Object.keys(S.off)) $("#toggle-feat-" + k).addEventListener("click", () => { S.off[k] = !S.off[k]; render(); });
$("#toggle-savefail").addEventListener("click", () => { S.saveFail = !S.saveFail; render(); });

/* Startzustand per URL, z. B. ?role=user&theme=dark&width=390&view=area&area=buero */
(function applyParams() {
  const p = new URLSearchParams(location.search);
  if (p.get("role") === "user" || p.get("role") === "admin") S.role = p.get("role");
  if (p.get("theme") === "dark" || p.get("theme") === "light") S.theme = p.get("theme");
  if (["320", "390", "430", "768", "1024", "1280", "1440"].includes(p.get("width"))) S.width = Number(p.get("width"));
  if (p.get("view")) S.view = p.get("view");
  if (p.get("area")) S.areaId = p.get("area");
  if (p.get("loss") === "1") S.conn = "lost";
  if (p.get("unknown") === "1") S.unknownMode = true;
  if (p.get("disabled") === "1") Object.keys(S.off).forEach(k => { S.off[k] = true; });
  if (p.get("savefail") === "1") S.saveFail = true;
  if (p.get("loading") === "1") S.loading = true;
  if (p.get("empty") === "1") S.empty = true;
